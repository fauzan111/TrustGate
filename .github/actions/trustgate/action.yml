name: "TrustGate release gate"
description: "Fail a pull request when model quality regresses beyond a tolerance, with a bounded false-decision rate."
author: "TrustGate"

inputs:
  candidate-scores:
    description: "Path to a JSON file of candidate per-item pass scores (0/1 or [0,1])."
    required: false
    default: ""
  baseline-scores:
    description: "Path to a JSON file of baseline per-item pass scores."
    required: false
    default: ""
  margin:
    description: "Tolerated quality drop (pass-rate points)."
    required: false
    default: "0.05"
  alpha:
    description: "Target false-decision rate."
    required: false
    default: "0.05"
  method:
    description: "CI method: normal | hoeffding."
    required: false
    default: "normal"
  strict:
    description: "Fail on INVESTIGATE as well as BLOCK."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install TrustGate
      shell: bash
      run: pip install -e .

    - name: Run release gate
      shell: bash
      run: |
        ARGS="--candidate-scores '${{ inputs.candidate-scores }}' --baseline-scores '${{ inputs.baseline-scores }}'"
        if [ -z "${{ inputs.candidate-scores }}" ]; then ARGS=""; fi
        STRICT=""
        if [ "${{ inputs.strict }}" = "true" ]; then STRICT="--strict"; fi
        eval trustgate gate-ci $ARGS \
          --margin ${{ inputs.margin }} \
          --alpha ${{ inputs.alpha }} \
          --method ${{ inputs.method }} \
          $STRICT
