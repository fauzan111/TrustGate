[project]
name = "trustgate"
version = "0.1.0"
description = "Risk-controlled evaluation & release-gating for LLM / RAG / agent systems."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "typer>=0.9",
]

[project.optional-dependencies]
# Heavier capabilities added in later milestones; the walking skeleton needs none of these.
stats = ["numpy>=1.26", "scipy>=1.11", "statsmodels>=0.14", "scikit-learn>=1.3"]
embed = ["sentence-transformers>=2.2"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dashboard = ["streamlit>=1.30"]
dev = ["pytest>=8.0", "ruff>=0.3", "mypy>=1.8"]

[project.scripts]
trustgate = "trustgate.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustgate"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
